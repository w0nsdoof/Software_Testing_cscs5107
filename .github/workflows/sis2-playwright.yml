name: SIS 2 Playwright

on:
  push:
    branches: [main, sis2, 'sis2/**']
    paths: ['week6-sis2/**', '.github/workflows/sis2-playwright.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sis2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: week6-sis2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week6-sis2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Discover data-test attributes
        if: ${{ vars.SIS2_DISCOVER == 'true' || contains(github.event.head_commit.message, '[discover]') }}
        run: npm run discover

      - name: Run tests (parallel, random order)
        id: tests
        continue-on-error: true
        run: npx playwright test --reporter=list,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ci-out/results.json

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p ci-out
          cp -r playwright-report ci-out/ 2>/dev/null || true
          cp -r test-results ci-out/ 2>/dev/null || true
          echo "run=${GITHUB_RUN_NUMBER} sha=${GITHUB_SHA} outcome=${{ steps.tests.outcome }} url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > ci-out/RUN.txt

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            week6-sis2/ci-out
          retention-days: 14

      - name: Publish outputs to ci-results branch
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/res && mkdir /tmp/res && cd /tmp/res
          git init -q -b ci-results
          git config user.name "sis2-ci"
          git config user.email "sis2-ci@users.noreply.github.com"
          cp -r "$GITHUB_WORKSPACE/week6-sis2/ci-out/." .
          # keep the branch small: drop videos/zips, keep json, md, png, html
          find . -name '*.webm' -delete || true
          git add -A
          git commit -q -m "CI results for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

      - name: Fail job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
