name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: week6-sis2
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week6-sis2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start Toolshop container stack (when BASE_URL is not set)
        if: ${{ vars.BASE_URL == '' }}
        working-directory: ${{ github.workspace }}
        run: |
          git clone --depth 1 https://github.com/testsmith-io/practice-software-testing.git /tmp/pst
          cd /tmp/pst
          # exported so the later exec/logs calls interpolate the same compose file
          export SPRINT=sprint5 DISABLE_LOGGING=true
          sed -i 's|image: testsmith/practice-software-testing-web|image: nginx:1.23.3-alpine\n    volumes:\n      - ./_docker/vhost.conf:/etc/nginx/conf.d/default.conf:ro\n      - laravel-app-code:/var/www|' docker-compose.prod.yml
          docker compose -f docker-compose.prod.yml up --pull missing -d mariadb laravel-api web angular-ui
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T mariadb mysqladmin ping -h localhost -u root -proot --silent 2>/dev/null; then
              break
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed --force
          # ng serve compiles the UI on container start; upstream CI allows it 5 minutes
          for i in $(seq 1 60); do
            if curl -sf --max-time 5 http://localhost:8091/status >/dev/null && curl -sf --max-time 5 http://localhost:4200 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.prod.yml logs
          exit 1
      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          BASE_URL: ${{ vars.BASE_URL || 'http://localhost:4200' }}
          API_URL: ${{ vars.API_URL || 'http://localhost:8091' }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: week6-sis2/blob-report
          retention-days: 1
      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            week6-sis2/test-results/
            week6-sis2/reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week6-sis2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: week6-sis2/package-lock.json
      - run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: week6-sis2/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: week6-sis2/playwright-report
          retention-days: 14
      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: week6-sis2/reports/junit-merged.xml
          retention-days: 14
